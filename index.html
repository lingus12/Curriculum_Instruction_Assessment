:root{
  --blue:#0068B7; --blue-deep:#004E8A; --blue-050:#EAF3FB;
  --green:#00A04E; --green-deep:#007A3B; --green-050:#EAF7F0;
  --ink:#1c2430; --ink-2:#4a5568; --ink-3:#8a94a3;
  --line:#dfe5ec; --bg:#f4f7fa; --paper:#ffffff;
  --font:'Goorm Sans',"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --font-head:'Hakgyoansim Allimjang','Goorm Sans',"Pretendard","Malgun Gothic",sans-serif;
}
*{ box-sizing:border-box; margin:0; padding:0 }
body{ font-family:var(--font); background:var(--bg); color:var(--ink); min-height:100vh;
      display:flex; flex-direction:column }
/* ── 상단 기관 바 (goe.go.kr 풍: 흰 바탕, 얇은 경계, 좌측 로고) ── */
.gnb{ background:var(--paper); border-bottom:1px solid var(--line) }
.gnb-in{ max-width:960px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:12px }
.gnb img{ height:40px; display:block }
.gnb .gnb-sub{ margin-left:auto; font-size:12.5px; color:var(--ink-3) }
/* ── 본문 ── */
.hero{ flex:1; display:flex; align-items:center; justify-content:center; padding:40px 16px }
.card{ width:100%; max-width:760px; background:var(--paper); border:1px solid var(--line);
       border-radius:16px; box-shadow:0 6px 24px rgba(0,40,80,.06); padding:44px 40px; text-align:center }
.badge{ display:inline-block; font-size:12px; font-weight:700; color:var(--blue);
        background:var(--blue-050); border-radius:999px; padding:4px 14px; letter-spacing:.5px }
h1{ font-family:var(--font-head); font-size:30px; color:var(--ink); margin:14px 0 6px; line-height:1.35 }
.actions{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:32px }
.act{ display:block; text-decoration:none; border-radius:12px; padding:24px 18px 22px; transition:.15s;
      border:1.5px solid var(--line) }
.act .ic{ font-size:30px; display:block; margin-bottom:8px }
.act .tt{ font-family:var(--font-head); font-size:18px; font-weight:700; display:block }
.act .dd{ font-size:12.5px; margin-top:6px; display:block; line-height:1.6 }
.act-run{ background:var(--blue); border-color:var(--blue) }
.act-run .tt, .act-run .ic{ color:#fff }
.act-run .dd{ color:#dcecfa }
.act-run:hover{ background:var(--blue-deep); border-color:var(--blue-deep) }
.act-dl{ background:var(--paper); border-color:var(--green) }
.act-dl .tt, .act-dl .ic{ color:var(--green-deep) }
.act-dl .dd{ color:var(--ink-2) }
.act-dl:hover{ background:var(--green-050) }
/* ── 하단 ── */
footer{ background:var(--paper); border-top:1px solid var(--line); padding:16px 20px;
        font-size:12px; color:var(--ink-3); text-align:center; line-height:1.8 }
footer b{ color:var(--ink-2); font-weight:700 }
@media (max-width:640px){
  .card{ padding:32px 22px } h1{ font-size:24px }
  .actions{ grid-template-columns:1fr }
}
</style>
